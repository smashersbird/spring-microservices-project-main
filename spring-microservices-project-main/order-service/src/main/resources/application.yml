server:
  port: 8082

spring:
  application:
    name: order-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

spring.cloud.openfeign:
  client:
    config:
      default:
        logger-level: BASIC

# ============================================================
# RESILIENCE4J — Circuit Breaker, Retry, Bulkhead
# ============================================================
resilience4j:

  # ----------------------------------------------------------
  # CIRCUIT BREAKER
  # ----------------------------------------------------------
  circuitbreaker:
    instances:
      product-service:
        # COUNT_BASED: track last N calls (vs TIME_BASED: track calls in last N seconds)
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10           # track the last 10 calls

        # Open circuit when 50%+ of the last 10 calls fail
        failure-rate-threshold: 50

        # Also open if 50%+ of calls take longer than slow-call-duration-threshold
        # (slow calls are as harmful as failed calls)
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s

        # Don't compute failure rate until at least 5 calls have been made.
        # Without this, the first failed call would immediately open the circuit (1/1 = 100%).
        minimum-number-of-calls: 5

        # OPEN state: wait 10s before moving to HALF-OPEN and retrying
        wait-duration-in-open-state: 10s

        # HALF-OPEN state: allow 3 test calls to probe if service recovered
        permitted-number-of-calls-in-half-open-state: 3

        # Automatically transition OPEN → HALF-OPEN after wait duration (no manual trigger)
        automatic-transition-from-open-to-half-open-enabled: true

        # These exceptions are counted as failures (trigger circuit tripping)
        record-exceptions:
          - feign.FeignException
          - java.io.IOException
          - java.util.concurrent.TimeoutException

        # These exceptions are IGNORED — not counted as failures, circuit stays closed.
        # IllegalArgumentException = business errors (product not found, bad stock) —
        # these are expected responses, not service failures.
        ignore-exceptions:
          - java.lang.IllegalArgumentException
          - com.microservices.order.resilience.ServiceUnavailableException

  # ----------------------------------------------------------
  # RETRY
  # ----------------------------------------------------------
  retry:
    instances:
      product-service:
        max-attempts: 2          # 1 initial call + 1 retry = 2 total attempts
        wait-duration: 200ms     # wait 200ms before retrying
        retry-exceptions:
          - feign.FeignException  # retry on ANY Feign error
          - java.io.IOException
        ignore-exceptions:
          - java.lang.IllegalArgumentException  # don't retry business errors

      user-service:
        max-attempts: 3           # 1 initial + 2 retries
        wait-duration: 500ms
        # enable-exponential-backoff: true    # uncomment for exponential backoff
        # exponential-backoff-multiplier: 2   # 500ms → 1000ms → 2000ms
        retry-exceptions:
          - feign.FeignException
          - java.io.IOException
        ignore-exceptions:
          - java.lang.IllegalArgumentException  # 404 user not found — don't retry

  # ----------------------------------------------------------
  # BULKHEAD (Semaphore-based)
  # ----------------------------------------------------------
  bulkhead:
    instances:
      product-service:
        # At most 10 concurrent calls to product-service from this service instance.
        # An 11th concurrent call is immediately rejected (BulkheadFullException → fallback).
        max-concurrent-calls: 10
        # Wait up to 100ms for a permit before giving up
        max-wait-duration: 100ms

# ============================================================
# ACTUATOR — Circuit Breaker health exposure
# GET /actuator/health → shows each CB: CLOSED / OPEN / HALF_OPEN
# GET /actuator/metrics/resilience4j.circuitbreaker.state → numeric state
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always    # show CB details in /actuator/health response
  health:
    circuitbreakers:
      enabled: true           # add circuit breaker health indicator
    retryevents:
      enabled: true

logging:
  level:
    com.microservices.order: DEBUG
    io.github.resilience4j: DEBUG    # shows CB state transitions in logs
