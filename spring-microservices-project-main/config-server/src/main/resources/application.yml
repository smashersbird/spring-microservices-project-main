server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" activates the local-filesystem backend.
    # Without this, Config Server defaults to Git and will fail to start.
    active: native
  cloud:
    config:
      server:
        native:
          # When you run "mvn spring-boot:run" from inside config-server/,
          # user.dir = .../config-server  so  ../config-repo = the config-repo folder.
          search-locations: file:${user.dir}/../config-repo

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
