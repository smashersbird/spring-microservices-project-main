spring:
  application:
    # This name is used by Config Server to find the right config file.
    # Config Server will look for "user-service.yml" in the config-repo folder.
    name: user-service

  config:
    # Modern Spring Boot 3.x way to pull config from Config Server.
    # "optional:" means: if Config Server is down, don't crash — use local defaults.
    import: "optional:configserver:http://localhost:8888"

  profiles:
    # Change to "dev" to load user-service-dev.yml from config-repo
    active: default

eureka:
  client:
    service-url:
      # The address of the Eureka server to register with
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Register using IP address instead of hostname (more reliable locally)
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # Expose health, info, and refresh over HTTP
        # "refresh" is the endpoint you call to reload config without restart
        include: health,info,refresh
