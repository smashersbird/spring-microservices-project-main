server:
  port: 8083

spring:
  application:
    name: product-service   # must match the name used in @FeignClient(name="product-service")

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info